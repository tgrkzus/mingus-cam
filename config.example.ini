[camera]
url = rtsp://USER:PASSWORD@CAMERA-IP:PORT/stream1
; set to true to also keep the camera's audio (converted to AAC)
record_audio = false
; extra ffmpeg input options, normally leave blank
input_args =

[server]
host = 0.0.0.0
port = 8080
; the code you type into the web page
passcode = change-me
; any long random string; used to sign the login cookie
secret_key = change-me-too

[storage]
; recordings and clips go here (relative to where you start the app)
data_dir = data
; length of each continuous-recording file
segment_seconds = 10
; continuous recording is kept this long
recording_keep_hours = 24
; motion clips are kept this long
clip_keep_days = 7
; hard cap on everything in data_dir; oldest files are deleted first
max_total_gb = 50

[motion]
; frames per second for the live view and motion check
fps = 5
live_width = 640
; how much a pixel must change (0-255) to count as changed
pixel_threshold = 25
; percent of the picture that must change to count as motion (lower = more sensitive)
min_area_percent = 0.5
; changes bigger than this are treated as lighting changes, not motion
max_area_percent = 60
; consecutive motion frames needed to start an event
trigger_frames = 3
; seconds of video kept before motion starts and after it stops
pre_roll_seconds = 5
post_roll_seconds = 10
; ignore events shorter than this
min_event_seconds = 2
; long events are split into clips of at most this length
max_clip_seconds = 600
